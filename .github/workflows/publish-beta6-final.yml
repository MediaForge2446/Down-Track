name: Publish DownTrack beta.6 Final

on:
  push:
    branches:
      - 'bootstrap/publish-beta6-final'

permissions:
  contents: write

env:
  RELEASE_TAG: v1.0.0-beta.6
  RELEASE_VERSION: 1.0.0-beta.6
  RELEASE_TARGET: 3d1908375cb15542d5c7c6d6a41c1445abf9a4f1

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout validated main
        uses: actions/checkout@v4
        with:
          ref: 3d1908375cb15542d5c7c6d6a41c1445abf9a4f1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DownTrack.sln

      - name: Build
        shell: pwsh
        run: dotnet build DownTrack.sln -c Release --no-restore -p:Version=$env:RELEASE_VERSION

      - name: Publish DownTrack
        shell: pwsh
        run: dotnet publish src/DownTrack.App/DownTrack.App.csproj -c Release -r win-x64 --self-contained false -o publish/DownTrack -p:Version=$env:RELEASE_VERSION

      - name: Smoke test DownTrack
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish/DownTrack/DownTrack.exe'
          if (-not (Test-Path $exe)) { throw 'Published DownTrack.exe not found.' }
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($p.HasExited) { throw "DownTrack exited during smoke test with code $($p.ExitCode)." }
          }
          finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Prepare bundled media engine
        shell: pwsh
        run: |
          $engineRoot = Join-Path $PWD 'publish/DownTrack/bin'
          $downloads = Join-Path $PWD 'engine-downloads'
          New-Item -ItemType Directory -Force -Path $engineRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $downloads | Out-Null

          function Get-Hash([string]$path, [string]$name) {
            foreach ($line in Get-Content $path) {
              $parts = $line.Trim() -split '\s+'
              if ($parts.Count -ge 1 -and $parts[0].Length -eq 64 -and $parts[0] -match '^[0-9a-fA-F]{64}$') {
                if ($parts.Count -eq 1 -or ($parts[1..($parts.Count - 1)] -replace '^\*','') -contains $name) {
                  return $parts[0].ToLowerInvariant()
                }
              }
            }
            throw "Checksum not found for $name."
          }

          function Download-Verified([string]$url, [string]$sumUrl, [string]$name) {
            $file = Join-Path $downloads $name
            $sum = Join-Path $downloads ($name + '.sum')
            Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $file
            Invoke-WebRequest -UseBasicParsing -Uri $sumUrl -OutFile $sum
            $expected = Get-Hash $sum $name
            $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "SHA-256 mismatch for $name." }
            return $file
          }

          $yt = Download-Verified 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/SHA2-256SUMS' 'yt-dlp.exe'
          Copy-Item $yt (Join-Path $engineRoot 'yt-dlp.exe') -Force

          $ff = Download-Verified 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip.sha256' 'ffmpeg-release-essentials.zip'
          $ffDir = Join-Path $downloads 'ffmpeg'
          Expand-Archive -Path $ff -DestinationPath $ffDir -Force
          $ffmpeg = Get-ChildItem $ffDir -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          $ffprobe = Get-ChildItem $ffDir -Recurse -Filter 'ffprobe.exe' | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'FFmpeg binaries not found.' }
          Copy-Item $ffmpeg.FullName (Join-Path $engineRoot 'ffmpeg.exe') -Force
          Copy-Item $ffprobe.FullName (Join-Path $engineRoot 'ffprobe.exe') -Force

          $deno = Download-Verified 'https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip' 'https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip.sha256sum' 'deno-x86_64-pc-windows-msvc.zip'
          $denoDir = Join-Path $downloads 'deno'
          Expand-Archive -Path $deno -DestinationPath $denoDir -Force
          $denoExe = Get-ChildItem $denoDir -Recurse -Filter 'deno.exe' | Select-Object -First 1
          if (-not $denoExe) { throw 'Deno binary not found.' }
          Copy-Item $denoExe.FullName (Join-Path $engineRoot 'deno.exe') -Force

          foreach ($tool in @('yt-dlp.exe','ffmpeg.exe','ffprobe.exe','deno.exe')) {
            if (-not (Test-Path (Join-Path $engineRoot $tool))) { throw "Missing bundled tool: $tool" }
          }

      - name: Package DownTrack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/release | Out-Null
          Compress-Archive -Path 'publish/DownTrack/*' -DestinationPath 'publish/release/DownTrack-win-x64.zip' -CompressionLevel Fastest
          $hash = (Get-FileHash 'publish/release/DownTrack-win-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DownTrack-win-x64.zip" | Set-Content 'publish/release/DownTrack-win-x64.zip.sha256' -Encoding ascii
          $env:RELEASE_VERSION | Set-Content 'publish/release/DownTrack-version.txt' -Encoding ascii

      - name: Publish WebSetup
        shell: pwsh
        run: dotnet publish src/DownTrack.WebSetup/DownTrack.WebSetup.csproj -c Release -r win-x64 -o publish/WebSetup -p:Version=$env:RELEASE_VERSION

      - name: Validate WebSetup
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish/WebSetup/DownTrack-WebSetup.exe'
          if (-not (Test-Path $exe)) { throw 'WebSetup executable not found.' }
          $files = Get-ChildItem 'publish/WebSetup' -File
          if ($files.Count -ne 1 -or $files[0].Name -ne 'DownTrack-WebSetup.exe') { throw 'WebSetup is not single-file.' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DownTrack-WebSetup.exe" | Set-Content 'publish/release/DownTrack-WebSetup.exe.sha256' -Encoding ascii

      - name: Smoke test WebSetup
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish/WebSetup/DownTrack-WebSetup.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(10000)) { Stop-Process -Id $p.Id -Force; throw 'WebSetup smoke test timed out.' }
          if ($p.ExitCode -ne 0) { throw "WebSetup smoke test failed with code $($p.ExitCode)." }

      - name: Create or update beta.6 release
        shell: pwsh
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          $assets = @(
            'publish/release/DownTrack-win-x64.zip',
            'publish/release/DownTrack-win-x64.zip.sha256',
            'publish/release/DownTrack-version.txt',
            'publish/WebSetup/DownTrack-WebSetup.exe',
            'publish/release/DownTrack-WebSetup.exe.sha256'
          )
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $assets --clobber
          } else {
            gh release create $env:RELEASE_TAG $assets --target $env:RELEASE_TARGET --title "DownTrack $env:RELEASE_TAG" --generate-notes
          }

      - name: End-to-end WebSetup validation
        shell: pwsh
        timeout-minutes: 15
        run: |
          $installer = Join-Path $PWD 'publish/WebSetup/DownTrack-WebSetup.exe'
          $p = Start-Process -FilePath $installer -PassThru
          if (-not $p.WaitForExit(900000)) { Stop-Process -Id $p.Id -Force; throw 'WebSetup install timed out.' }
          if ($p.ExitCode -ne 0) { throw "WebSetup exited with code $($p.ExitCode)." }

          $installedExe = Join-Path $env:LOCALAPPDATA 'Programs/DownTrack/DownTrack.exe'
          $versionFile = Join-Path $env:LOCALAPPDATA 'Programs/DownTrack/.downtrack-version'
          $engineDir = Join-Path $env:LOCALAPPDATA 'DownTrack/bin'
          $logPath = Join-Path $env:LOCALAPPDATA 'DownTrack/installer.log'

          if (-not (Test-Path $installedExe)) { throw 'Installed DownTrack.exe not found.' }
          if (-not (Test-Path $versionFile)) { throw 'Installed version marker not found.' }
          if (-not (Test-Path $logPath)) { throw 'installer.log was not created.' }

          foreach ($tool in @('yt-dlp.exe','ffmpeg.exe','ffprobe.exe','deno.exe')) {
            if (-not (Test-Path (Join-Path $engineDir $tool))) { throw "Missing installed engine tool: $tool" }
          }

          $version = (Get-Content $versionFile -Raw).Trim()
          if ($version -ne $env:RELEASE_VERSION) { throw "Installed version mismatch: $version" }

          $log = Get-Content $logPath -Raw
          if ($log -match 'yt-dlp/yt-dlp/releases/latest/download|gyan.dev/ffmpeg/builds|denoland/deno/releases/latest/download') {
            throw 'WebSetup attempted an external media-engine download.'
          }

          Get-Process -Name DownTrack -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload final assets
        uses: actions/upload-artifact@v4
        with:
          name: DownTrack-beta6-final
          path: |
            publish/release/*
            publish/WebSetup/DownTrack-WebSetup.exe
          if-no-files-found: error
