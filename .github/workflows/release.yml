name: DownTrack Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: downtrack-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate release tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+([\-+].*)?$') {
            throw "Tag must look like v1.2.3."
          }
          Write-Host "Building DownTrack version $version"

      - name: Restore
        run: dotnet restore DownTrack.sln

      - name: Build
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet build DownTrack.sln -c Release --no-restore -p:Version=$version

      - name: Publish DownTrack
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish src/DownTrack.App/DownTrack.App.csproj -c Release -r win-x64 --self-contained false -o publish/DownTrack -p:Version=$version

      - name: Smoke test DownTrack
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish/DownTrack/DownTrack.exe'
          if (-not (Test-Path $exe)) { throw "Published executable not found: $exe" }
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "DownTrack exited during smoke test with code $($process.ExitCode)."
            }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Package release assets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          New-Item -ItemType Directory -Force -Path publish/release | Out-Null
          Compress-Archive -Path 'publish/DownTrack/*' -DestinationPath 'publish/release/DownTrack-win-x64.zip' -CompressionLevel Fastest
          $hash = (Get-FileHash 'publish/release/DownTrack-win-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DownTrack-win-x64.zip" | Set-Content 'publish/release/DownTrack-win-x64.zip.sha256' -Encoding ascii
          $version | Set-Content 'publish/release/DownTrack-version.txt' -Encoding ascii

      - name: Publish WebSetup
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish src/DownTrack.WebSetup/DownTrack.WebSetup.csproj -c Release -r win-x64 -o publish/WebSetup -p:Version=$version

      - name: Validate WebSetup
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish/WebSetup/DownTrack-WebSetup.exe'
          if (-not (Test-Path $exe)) { throw "WebSetup executable not found: $exe" }
          $files = Get-ChildItem 'publish/WebSetup' -File
          if ($files.Count -ne 1 -or $files[0].Name -ne 'DownTrack-WebSetup.exe') {
            throw "WebSetup must publish as one file."
          }
          $sizeMb = [Math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "WebSetup size: $sizeMb MB"

      - name: Smoke test WebSetup
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish/WebSetup/DownTrack-WebSetup.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(10000)) {
            Stop-Process -Id $process.Id -Force
            throw "WebSetup smoke test timed out."
          }
          if ($process.ExitCode -ne 0) {
            throw "WebSetup smoke test failed with code $($process.ExitCode)."
          }

      - name: Create or update GitHub release
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag 'publish/release/DownTrack-win-x64.zip' 'publish/release/DownTrack-win-x64.zip.sha256' 'publish/release/DownTrack-version.txt' 'publish/WebSetup/DownTrack-WebSetup.exe' --clobber
          }
          else {
            gh release create $tag 'publish/release/DownTrack-win-x64.zip' 'publish/release/DownTrack-win-x64.zip.sha256' 'publish/release/DownTrack-version.txt' 'publish/WebSetup/DownTrack-WebSetup.exe' --title "DownTrack $tag" --generate-notes
          }

      - name: End-to-end WebSetup install
        shell: pwsh
        timeout-minutes: 8
        run: |
          $installer = Join-Path $PWD 'publish/WebSetup/DownTrack-WebSetup.exe'
          $process = Start-Process -FilePath $installer -PassThru
          if (-not $process.WaitForExit(360000)) {
            Stop-Process -Id $process.Id -Force
            throw "WebSetup install timed out."
          }
          if ($process.ExitCode -ne 0) {
            throw "WebSetup exited with code $($process.ExitCode)."
          }

          $installedExe = Join-Path $env:LOCALAPPDATA 'Programs/DownTrack/DownTrack.exe'
          $versionFile = Join-Path $env:LOCALAPPDATA 'Programs/DownTrack/.downtrack-version'
          $expected = $env:GITHUB_REF_NAME.TrimStart('v')

          if (-not (Test-Path $installedExe)) { throw "Installed DownTrack.exe not found." }
          if (-not (Test-Path $versionFile)) { throw "Installed version marker not found." }

          $version = (Get-Content $versionFile -Raw).Trim()
          if ($version -ne $expected) {
            throw "Installed version marker mismatch: $version"
          }

          $running = Get-Process -Name DownTrack -ErrorAction SilentlyContinue
          if ($running) {
            $running | Stop-Process -Force
          }

      - name: Upload final assets
        uses: actions/upload-artifact@v4
        with:
          name: DownTrack-release
          path: |
            publish/release/*
            publish/WebSetup/DownTrack-WebSetup.exe
          if-no-files-found: error
