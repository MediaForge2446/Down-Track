name: DownTrack Beta 3 Release Bootstrap

on:
  push:
    branches:
      - 'bootstrap/beta3-clean'

permissions:
  contents: write

concurrency:
  group: downtrack-beta3-bootstrap
  cancel-in-progress: false

env:
  RELEASE_TAG: v1.0.0-beta.3
  RELEASE_VERSION: 1.0.0-beta.3
  RELEASE_TARGET: a80252c4a26224ff628ae65c5dd16ef05bc64a6a

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DownTrack.sln

      - name: Build
        shell: pwsh
        run: dotnet build DownTrack.sln -c Release --no-restore -p:Version=$env:RELEASE_VERSION

      - name: Publish DownTrack
        shell: pwsh
        run: dotnet publish src/DownTrack.App/DownTrack.App.csproj -c Release -r win-x64 --self-contained false -o publish/DownTrack -p:Version=$env:RELEASE_VERSION

      - name: Smoke test DownTrack
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish/DownTrack/DownTrack.exe'
          if (-not (Test-Path $exe)) { throw "Published executable not found: $exe" }
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) { throw "DownTrack exited during smoke test with code $($process.ExitCode)." }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Package release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/release | Out-Null
          Compress-Archive -Path 'publish/DownTrack/*' -DestinationPath 'publish/release/DownTrack-win-x64.zip' -CompressionLevel Fastest
          $hash = (Get-FileHash 'publish/release/DownTrack-win-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DownTrack-win-x64.zip" | Set-Content 'publish/release/DownTrack-win-x64.zip.sha256' -Encoding ascii
          $env:RELEASE_VERSION | Set-Content 'publish/release/DownTrack-version.txt' -Encoding ascii

      - name: Publish WebSetup
        shell: pwsh
        run: dotnet publish src/DownTrack.WebSetup/DownTrack.WebSetup.csproj -c Release -r win-x64 -o publish/WebSetup -p:Version=$env:RELEASE_VERSION

      - name: Validate WebSetup
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish/WebSetup/DownTrack-WebSetup.exe'
          if (-not (Test-Path $exe)) { throw "WebSetup executable not found: $exe" }
          $files = Get-ChildItem 'publish/WebSetup' -File
          if ($files.Count -ne 1 -or $files[0].Name -ne 'DownTrack-WebSetup.exe') {
            throw "WebSetup must publish as one file."
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DownTrack-WebSetup.exe" | Set-Content 'publish/release/DownTrack-WebSetup.exe.sha256' -Encoding ascii

      - name: Smoke test WebSetup
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish/WebSetup/DownTrack-WebSetup.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(10000)) {
            Stop-Process -Id $process.Id -Force
            throw "WebSetup smoke test timed out."
          }
          if ($process.ExitCode -ne 0) { throw "WebSetup smoke test failed with code $($process.ExitCode)." }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            'publish/release/DownTrack-WebSetup.exe.sha256',
            'publish/release/DownTrack-win-x64.zip',
            'publish/release/DownTrack-win-x64.zip.sha256',
            'publish/release/DownTrack-version.txt',
            'publish/WebSetup/DownTrack-WebSetup.exe'
          )
          gh release create $env:RELEASE_TAG $assets --title "DownTrack $env:RELEASE_TAG" --generate-notes --target $env:RELEASE_TARGET

      - name: End-to-end WebSetup install
        shell: pwsh
        timeout-minutes: 8
        run: |
          $installer = Join-Path $PWD 'publish/WebSetup/DownTrack-WebSetup.exe'
          $process = Start-Process -FilePath $installer -PassThru
          if (-not $process.WaitForExit(360000)) {
            Stop-Process -Id $process.Id -Force
            throw "WebSetup install timed out."
          }
          if ($process.ExitCode -ne 0) { throw "WebSetup exited with code $($process.ExitCode)." }

          $installedExe = Join-Path $env:LOCALAPPDATA 'Programs/DownTrack/DownTrack.exe'
          $versionFile = Join-Path $env:LOCALAPPDATA 'Programs/DownTrack/.downtrack-version'
          if (-not (Test-Path $installedExe)) { throw "Installed DownTrack.exe not found." }
          if (-not (Test-Path $versionFile)) { throw "Installed version marker not found." }

          $version = (Get-Content $versionFile -Raw).Trim()
          if ($version -ne $env:RELEASE_VERSION) { throw "Installed version marker mismatch: $version" }

          Get-Process -Name DownTrack -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
