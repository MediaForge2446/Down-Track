name: DownTrack Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: downtrack-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DownTrack.sln
      - name: Build
        run: dotnet build DownTrack.sln -c Release --no-restore --arch x64
      - name: Publish
        run: dotnet publish src/DownTrack.App/DownTrack.App.csproj -c Release -r win-x64 --self-contained false -o publish/DownTrack
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DownTrack-win-x64
          path: publish/DownTrack
          if-no-files-found: error
